[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portopt-db"
version = "0.1.0"
description = "Shared SQLAlchemy models, repositories, engine and Alembic migrations for the portopt Postgres database."
readme = "README.md"
# 3.12 floor: matches the workspace (pandas==3.0.5 requires Python>=3.12).
requires-python = ">=3.12"
authors = [{ name = "Silvio Baratto" }]

# Owns the database stack for the workspace; the single SQLAlchemy pin every
# consumer inherits (Python allows only one installed version).
dependencies = [
    "SQLAlchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.1",
    "pandas==3.0.5",
    # RepositoryBase's generic CRUD is typed against pydantic schemas.
    "pydantic==2.13.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["portopt_db*"]

[tool.setuptools.package-data]
portopt_db = ["py.typed"]

[tool.ruff]
line-length = 88
# py310 syntax target (matches the root config); runtime floor is >=3.12.
target-version = "py310"
# Alembic migrations are mechanical / auto-generated — not linted (E501 long
# op.* lines, S608 string SQL in data migrations, E402 env.py late imports).
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S", "RUF", "C4", "PTH"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["portopt_db"]
omit = ["*/__init__.py"]
