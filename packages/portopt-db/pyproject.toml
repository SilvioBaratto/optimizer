[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portopt-db"
version = "0.2.0"
description = "Shared SQLAlchemy models, repositories, engine and Alembic migrations for the portopt Postgres database."
readme = "README.md"
# 3.12 floor: matches the workspace (the root pins numpy==2.5.4 and scipy==1.18.1, which
# require Python>=3.12).
requires-python = ">=3.12"
authors = [{ name = "Silvio Baratto" }]

# Owns the database stack for the workspace; the single SQLAlchemy pin every
# consumer inherits (Python allows only one installed version).
dependencies = [
    "SQLAlchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.1",
    "pandas==3.1.1",
    # RepositoryBase's generic CRUD is typed against pydantic schemas.
    "pydantic==2.14.4",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["portopt_db*"]

[tool.setuptools.package-data]
portopt_db = ["py.typed"]

# ruff config lives in ruff.toml (extends the root config + mirrors
# ingestion/ruff.toml for the moved models/repositories).

[tool.mypy]
# Strict gate on the shared DB layer. These repos/models were only loosely
# checked while they lived under ingestion (disallow_untyped_defs=false, etc.);
# as their own package they ship py.typed, so consumers inherit these types —
# hold them to the same strict bar as the optimizer library. Scope is src only
# (CI runs `mypy src/portopt_db`); alembic/ and tests/ stay out.
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The traceability plugin (`--traceability-out`) is one file in scripts/ci, outside
# every package, shared by the four suites; this path lets `-p traceability` load it.
pythonpath = ["../../scripts/ci"]
addopts = "-p no:cacheprovider -p traceability"
markers = [
    "criterion(id): cite requirement <id> of docs/requirements.md (a REQ- id) or an acceptance-criterion label",
    "defect(issue): link this regression test to GitHub issue <issue>",
    "integration: needs a real PostgreSQL server (PORTOPT_TEST_DATABASE_URL)",
]

[tool.coverage.run]
branch = true
source = ["portopt_db"]
omit = ["*/__init__.py"]
