<div class="space-y-4">
  @if (error(); as err) {
    <app-page-error-banner [message]="err" />
  }

  @if (snapshots().length > 0) {
    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Snapshots feed (most recent first)</h3>
      <app-data-table
        [columns]="columns"
        [rows]="tableRows()"
        [total]="tableRows().length"
        [pageSize]="20"
        [dense]="true"
        [showExport]="true"
        exportFilename="snapshots" />
    </div>
  } @else {
    <div class="bg-surface-raised border border-border rounded-lg p-8 text-center">
      <p class="text-xs text-text-secondary">
        No snapshot history for this portfolio yet.
      </p>
    </div>
  }
</div>
