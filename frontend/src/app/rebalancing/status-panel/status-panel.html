<div class="space-y-4">

  @if (error(); as err) {
    <app-page-error-banner [message]="err" />
  }

  <!-- Threshold selector -->
  <div class="bg-surface-raised border border-border rounded-lg p-4 flex items-center gap-4">
    <div>
      <label for="driftThreshold" class="text-xs text-text-secondary block mb-1">Drift threshold</label>
      <input id="driftThreshold" type="number" min="0" max="1" step="0.01"
        [ngModel]="threshold()"
        (ngModelChange)="onThresholdInput(+$event)"
        class="w-32 px-3 py-1.5 text-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent" />
    </div>
    <div class="ml-auto text-xs text-text-secondary">
      Total drift: <span class="font-mono text-text">{{ (totalDrift() * 100).toFixed(2) }}%</span>
      · Breached: <span class="font-mono text-loss">{{ breachedCount() }}</span>
    </div>
  </div>

  @if (driftEntries().length > 0) {
    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Target vs Actual Weights</h3>
      <app-echarts-rebalancing-diff [data]="diffData()" [height]="320" />
    </div>

    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Drift breakdown</h3>
      <app-data-table
        [columns]="driftColumns"
        [rows]="driftRows()"
        [total]="driftRows().length"
        [pageSize]="20"
        [dense]="true"
        [stickyFirstColumn]="true" />
    </div>
  } @else {
    <div class="bg-surface-raised border border-border rounded-lg p-8 text-center">
      <p class="text-xs text-text-secondary">
        No drift data. Select a portfolio with target weights to see the drift analysis.
      </p>
    </div>
  }

</div>
