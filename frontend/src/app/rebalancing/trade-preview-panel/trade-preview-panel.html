<div class="space-y-6">
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <app-stat-card label="Turnover" [value]="kpiTurnover()" subtitle="Σ |Δw| / 2" />
    <app-stat-card label="Trades" [value]="kpiTradeCount()" subtitle="Number of trades" />
    <app-stat-card label="Portfolio value" [value]="kpiPortfolioValue()" subtitle="For share conversion" />
  </div>

  @if (trades().length > 0) {
    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Weight changes (bps)</h3>
      <app-chart-toolbar [showDataTable]="false">
        <app-echarts-waterfall
          [categories]="waterfallCategories()"
          [values]="waterfallValues()"
          [height]="260" />
      </app-chart-toolbar>
    </div>

    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Trade list</h3>
      <app-data-table
        [columns]="tradeColumns"
        [rows]="tradeRows()"
        [total]="tradeRows().length"
        [pageSize]="15"
        [dense]="true"
        [showExport]="true"
        exportFilename="trade-preview" />
    </div>
  } @else {
    <div class="bg-surface-raised border border-border rounded-lg p-8 text-center">
      <p class="text-xs text-text-secondary">
        No trade preview. Ensure the portfolio has an active policy and recent snapshot.
      </p>
    </div>
  }
</div>
