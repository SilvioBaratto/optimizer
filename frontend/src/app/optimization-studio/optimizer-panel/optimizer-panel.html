<div class="space-y-5">

  <!-- Method picker: 4 curated presets -->
  <div class="bg-surface-raised border border-border rounded-lg p-4 space-y-3">
    <h3 class="text-sm font-semibold text-text">Optimization Method</h3>
    <div class="grid grid-cols-2 gap-2">
      @for (method of methods; track method.id) {
        <button
          type="button"
          [class]="selectedMethodId() === method.id
            ? 'px-3 py-2 text-xs font-medium rounded-lg bg-accent text-white text-center transition-colors'
            : 'px-3 py-2 text-xs font-medium rounded-lg border border-border text-text hover:border-accent text-center transition-colors'"
          (click)="selectMethod(method.id)">
          {{ method.label }}
        </button>
      }
    </div>
  </div>

  <!-- Constraints: reactive form -->
  <div class="bg-surface-raised border border-border rounded-lg p-4 space-y-4"
       [formGroup]="constraintsForm">
    <h3 class="text-sm font-semibold text-text">Constraints</h3>

    <!-- Long-only toggle -->
    <label class="flex items-center gap-3 cursor-pointer">
      <input type="checkbox" formControlName="longOnly" class="w-4 h-4 accent-accent" />
      <span class="text-sm text-text">Long-only (weights ≥ 0)</span>
    </label>

    <!-- Budget / Fully-invested toggle -->
    <label class="flex items-center gap-3 cursor-pointer">
      <input type="checkbox" formControlName="budget" class="w-4 h-4 accent-accent" />
      <span class="text-sm text-text">Fully-invested (weights sum to 1)</span>
    </label>

    <!-- Single-stock cap -->
    <div>
      <label for="stockCap" class="text-xs font-medium text-text-secondary block mb-1">
        Single-stock cap <span class="text-text-tertiary">(default 10%)</span>
      </label>
      <input
        id="stockCap"
        type="number"
        formControlName="stockCap"
        min="0.01" max="1" step="0.01"
        class="w-28 px-3 py-1.5 text-sm bg-surface border border-border rounded-lg text-text
               focus:outline-none focus:ring-1 focus:ring-accent" />
    </div>

    <!-- Min position size — display threshold only, not a solver floor -->
    <div>
      <label for="minPos" class="text-xs font-medium text-text-secondary block mb-1">
        Min position size
        <span class="text-text-tertiary">(display threshold, default 2%)</span>
      </label>
      <input
        id="minPos"
        type="number"
        formControlName="minPositionSize"
        min="0" max="0.10" step="0.01"
        class="w-28 px-3 py-1.5 text-sm bg-surface border border-border rounded-lg text-text
               focus:outline-none focus:ring-1 focus:ring-accent" />
    </div>
  </div>

  <!-- Run button -->
  <div class="flex justify-end">
    <button
      type="button"
      (click)="emitRun()"
      class="px-4 py-2 text-sm font-medium rounded-lg bg-accent text-white
             hover:bg-accent/90 transition-colors">
      Run Optimization
    </button>
  </div>

</div>
