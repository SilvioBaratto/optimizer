<div class="flex-1 overflow-y-auto p-6">
  <app-page-header title="Settings" subtitle="Application configuration and preferences" />

  <app-tab-group [tabs]="tabs" [activeTab]="activeTab()" (tabChange)="onTabChange($event)" />

  <div class="mt-6">
    @switch (activeTab()) {
      @case ('data') {
        <app-data-management-panel />
      }
      @case ('portfolios') {
        <app-portfolios-panel />
      }
      @case ('scheduler') {
        <app-scheduler-status-panel />
      }
      @case ('jobs') {
        <app-jobs-panel />
      }
    }
  </div>
</div>
