<div class="space-y-6">
  @if (hasData()) {
    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Effect summary (bps)</h3>
      <app-chart-toolbar [showDataTable]="false">
        <app-echarts-waterfall [categories]="waterfallCategories()" [values]="waterfallValues()" [height]="260" />
      </app-chart-toolbar>
    </div>

    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Sector attribution detail</h3>
      <app-data-table
        [columns]="sectorTableColumns"
        [rows]="sectorTableRows()"
        [total]="sectorTableRows().length"
        [pageSize]="15"
        [dense]="true"
        [showExport]="true"
        [stickyFirstColumn]="true"
        exportFilename="brinson-attribution" />
    </div>

    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Cumulative effect by sector</h3>
      <app-chart-toolbar [showDataTable]="false">
        <app-echarts-stacked-area [labels]="cumulativeAreaLabels()" [series]="cumulativeAreaSeries()" [height]="320" />
      </app-chart-toolbar>
    </div>
  } @else {
    <div class="bg-surface-raised border border-border rounded-lg p-8 text-center">
      <p class="text-xs text-text-secondary">
        No Brinson result yet. Click <span class="font-medium">Run Brinson</span> above.
      </p>
    </div>
  }
</div>
