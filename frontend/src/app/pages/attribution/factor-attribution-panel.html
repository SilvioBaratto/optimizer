<div class="space-y-6">
  @if (hasData()) {
    <div class="grid grid-cols-3 gap-3 sm:gap-4">
      <app-stat-card label="Portfolio Return" [value]="kpiPortfolioReturn()" subtitle="Over the period" />
      <app-stat-card label="Explained" [value]="kpiExplained()" subtitle="Σ contributions" />
      <app-stat-card label="Residual" [value]="kpiResidual()" subtitle="Portfolio − explained" />
    </div>

    <div class="bg-surface-raised border border-border rounded-lg p-4">
      <h3 class="text-data-sm font-medium text-text mb-3">Factor contribution detail</h3>
      <app-data-table
        [columns]="factorTableColumns"
        [rows]="factorTableRows()"
        [total]="factorTableRows().length"
        [pageSize]="15"
        [dense]="true" />
    </div>
  } @else {
    <div class="bg-surface-raised border border-border rounded-lg p-8 text-center">
      <p class="text-xs text-text-secondary">
        No factor attribution result yet. Click <span class="font-medium">Run Factor</span> above.
      </p>
    </div>
  }
</div>
