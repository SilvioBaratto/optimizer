<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  <!-- Rebalance Frequency -->
  <div>
    <label class="block text-data-xs font-medium text-text-secondary mb-1"
      >Rebalance frequency (trading days)</label
    >
    <input
      type="number"
      formControlName="rebalance_freq"
      min="1"
      step="1"
      aria-label="Rebalance frequency (trading days)"
      class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      [class.border-danger]="form.controls.rebalance_freq.invalid && form.controls.rebalance_freq.touched"
    />
  </div>

  <!-- N Selected -->
  <div>
    <label class="block text-data-xs font-medium text-text-secondary mb-1"
      >Selected assets (15 – 30)</label
    >
    <input
      type="number"
      formControlName="n_selected"
      min="15"
      max="30"
      step="1"
      aria-label="Selected assets (15 – 30)"
      class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      [class.border-danger]="form.controls.n_selected.invalid && form.controls.n_selected.touched"
    />
    @if (form.controls.n_selected.invalid && form.controls.n_selected.touched) {
      <p class="mt-1 text-data-xs text-danger">Must be between 15 and 30.</p>
    }
  </div>

  <!-- Cost / Tax -->
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-data-xs font-medium text-text-secondary mb-1"
        >Transaction cost (bps)</label
      >
      <input
        type="number"
        formControlName="cost_bps"
        min="0"
        step="0.5"
        aria-label="Transaction cost (bps)"
        class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      />
    </div>
    <div>
      <label class="block text-data-xs font-medium text-text-secondary mb-1"
        >Tax rate (0 – 1)</label
      >
      <input
        type="number"
        formControlName="tax_rate"
        min="0"
        max="1"
        step="0.01"
        aria-label="Tax rate (0 – 1)"
        class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      />
    </div>
  </div>

  <!-- Base Currency -->
  <div>
    <label class="block text-data-xs font-medium text-text-secondary mb-1"
      >Base currency</label
    >
    <select
      formControlName="base_currency"
      aria-label="Base currency"
      class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
    >
      @for (c of currencies; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>

  <!-- Checkboxes -->
  <div class="space-y-2">
    <label class="flex items-center gap-2.5 cursor-pointer">
      <input
        type="checkbox"
        formControlName="robust"
        class="w-4 h-4 rounded border-border text-accent"
      />
      <span class="text-data-sm text-text">Robust optimization</span>
    </label>
    <label class="flex items-center gap-2.5 cursor-pointer">
      <input
        type="checkbox"
        formControlName="persist"
        class="w-4 h-4 rounded border-border text-accent"
      />
      <span class="text-data-sm text-text">Persist final artifacts</span>
    </label>
  </div>

  <!-- Dates -->
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-data-xs font-medium text-text-secondary mb-1"
        >Start date</label
      >
      <input
        type="date"
        formControlName="start_date"
        aria-label="Start date"
        class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      />
    </div>
    <div>
      <label class="block text-data-xs font-medium text-text-secondary mb-1"
        >End date</label
      >
      <input
        type="date"
        formControlName="end_date"
        aria-label="End date"
        class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      />
    </div>
  </div>

  @if (form.errors?.['dateOrder']) {
    <p class="text-data-xs text-danger">End date must be on or after start date.</p>
  }

  <!-- Seed -->
  <div>
    <label class="block text-data-xs font-medium text-text-secondary mb-1">Seed</label>
    <input
      type="number"
      formControlName="seed"
      min="0"
      step="1"
      aria-label="Seed"
      class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
    />
  </div>

  <!-- Step parameters -->
  <fieldset class="space-y-3 pt-3 border-t border-border">
    <legend class="text-data-xs font-semibold text-text-secondary uppercase tracking-wide">
      Step parameters
    </legend>

    <!-- Load -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-data-xs font-medium text-text-secondary mb-1"
          >Macro country</label
        >
        <input
          type="text"
          formControlName="macro_country"
          aria-label="Macro country"
          class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
        />
      </div>
      <label class="flex items-center gap-2.5 cursor-pointer self-end pb-2">
        <input
          type="checkbox"
          formControlName="include_delisted"
          class="w-4 h-4 rounded border-border text-accent"
        />
        <span class="text-data-sm text-text">Include delisted</span>
      </label>
    </div>

    <!-- Screen preset -->
    <div>
      <label class="block text-data-xs font-medium text-text-secondary mb-1"
        >Screen preset</label
      >
      <select
        formControlName="preset"
        aria-label="Screen preset"
        class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
      >
        @for (p of presets; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
    </div>

    <!-- Build history / Coverage gate -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-data-xs font-medium text-text-secondary mb-1"
          >Market proxy ticker</label
        >
        <input
          type="text"
          formControlName="market_proxy_ticker"
          aria-label="Market proxy ticker"
          class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
        />
      </div>
      <div>
        <label class="block text-data-xs font-medium text-text-secondary mb-1"
          >Min factors (coverage gate)</label
        >
        <input
          type="number"
          formControlName="min_factors"
          min="1"
          step="1"
          aria-label="Min factors (coverage gate)"
          class="w-full px-3 py-2 text-data-sm bg-surface border border-border rounded-md text-text focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-colors"
        />
      </div>
    </div>

    <!-- Regime -->
    <div class="space-y-2">
      <label class="flex items-center gap-2.5 cursor-pointer">
        <input
          type="checkbox"
          formControlName="enable_tilts"
          class="w-4 h-4 rounded border-border text-accent"
        />
        <span class="text-data-sm text-text">Enable regime tilts</span>
      </label>
      <label class="flex items-center gap-2.5 cursor-pointer">
        <input
          type="checkbox"
          formControlName="persist_regime"
          class="w-4 h-4 rounded border-border text-accent"
        />
        <span class="text-data-sm text-text">Persist regime</span>
      </label>
    </div>
  </fieldset>

  <!-- Submit -->
  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full px-4 py-2 text-data-sm font-medium rounded-lg bg-accent text-white hover:bg-accent/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
  >
    Start pipeline
  </button>
</form>
