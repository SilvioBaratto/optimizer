<section class="block">
  <button
    type="button"
    (click)="toggle.emit()"
    class="w-full flex items-center gap-3 px-4 py-3 text-left"
  >
    <span [class]="'inline-block w-2 h-2 rounded-full shrink-0 ' + dotClass()"></span>
    <span class="min-w-0 flex-1">
      <span class="block text-data-sm text-text font-medium truncate">{{ title() }}</span>
      @if (summary() && !expanded()) {
        <span class="block text-data-xs text-text-secondary truncate">{{ summary() }}</span>
      } @else if (description()) {
        <span class="block text-data-xs text-text-tertiary truncate">{{ description() }}</span>
      }
    </span>
    <span
      [class]="
        'ml-auto shrink-0 text-data-xs px-2 py-0.5 rounded-full ' + badgeClass()
      "
      >{{ badgeLabel() }}</span
    >
    <svg
      class="w-4 h-4 shrink-0 text-text-tertiary transition-transform"
      [class.rotate-180]="expanded()"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 8l4 4 4-4" />
    </svg>
  </button>

  @if (expanded()) {
    <div class="border-t border-border p-4 sm:p-6 space-y-4">
      <ng-content />
      @if (showContinue() || showRetry()) {
        <div class="flex items-center gap-3 pt-1">
          @if (showContinue()) {
            <button
              type="button"
              (click)="continueStep.emit()"
              class="px-4 py-2 text-data-sm font-medium rounded-lg bg-accent text-white hover:bg-accent/90 transition-colors"
            >
              Continue →
            </button>
          }
          @if (showRetry()) {
            <button
              type="button"
              (click)="retry.emit()"
              class="px-4 py-2 text-data-sm font-medium rounded-md border border-loss/40 text-loss hover:bg-loss/10 transition-colors"
            >
              Retry
            </button>
          }
        </div>
      }
    </div>
  }
</section>
