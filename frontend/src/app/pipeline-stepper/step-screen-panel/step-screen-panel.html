@if (stepStatus() === StepStatus.Ready) {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3">
    <label class="block text-data-sm">
      <span class="block mb-1 text-text-secondary">Screen preset</span>
      <select
        formControlName="preset"
        data-testid="preset-select"
        class="w-full px-2 py-1.5 rounded-md border border-border bg-surface-inset text-text"
      >
        @for (p of presets; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
    </label>
    <button
      type="submit"
      data-testid="run-step"
      [disabled]="!form.valid"
      class="px-3 py-1.5 text-data-sm font-medium rounded-md bg-accent text-white hover:bg-accent/90 transition-colors disabled:opacity-40"
    >
      Run Step
    </button>
  </form>
}

@if (stepStatus() === StepStatus.Running) {
  <div
    data-testid="spinner"
    role="status"
    aria-label="Screening"
    class="inline-flex items-center gap-2 text-data-sm text-text-secondary"
  >
    <span
      class="inline-block w-4 h-4 rounded-full border-2 border-accent border-t-transparent animate-spin"
    ></span>
    Screening universe…
  </div>
}

@if (stepStatus() === StepStatus.Completed && screenResult(); as r) {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="flex flex-col">
      <app-stat-card label="Investable tickers" [value]="(r.n_investable | number) ?? ''" />
      @if (r.band_warning) {
        <span
          data-testid="band-warning"
          class="mt-1 self-start inline-flex items-center px-2 py-0.5 rounded-full text-data-xs font-medium bg-warning/10 text-warning border border-warning/40"
        >
          ⚠ outside band [{{ r.band_low }}, {{ r.band_high }}]
        </span>
      }
    </div>
    <app-stat-card label="Preset" [value]="r.preset" />
    <app-stat-card label="Band low" [value]="(r.band_low | number) ?? ''" />
    <app-stat-card label="Band high" [value]="(r.band_high | number) ?? ''" />
  </div>
}

@if (lastError(); as err) {
  <div
    data-testid="error-block"
    role="alert"
    class="mt-3 px-4 py-2 rounded-md border border-loss/40 bg-loss/10 text-data-sm text-loss"
  >
    {{ err }}
  </div>
}
