@if (stepStatus() === StepStatus.Ready) {
  <button
    type="button"
    data-testid="run-step"
    (click)="onRun()"
    class="px-3 py-1.5 text-data-sm font-medium rounded-md bg-accent text-white hover:bg-accent/90 transition-colors"
  >
    Run Step
  </button>
}

@if (stepStatus() === StepStatus.Running) {
  <div
    data-testid="spinner"
    role="status"
    aria-label="Loading"
    class="inline-flex items-center gap-2 text-data-sm text-text-secondary"
  >
    <span
      class="inline-block w-4 h-4 rounded-full border-2 border-accent border-t-transparent animate-spin"
    ></span>
    Loading data…
  </div>
}

@if (stepStatus() === StepStatus.Completed && loadResult(); as r) {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
    <app-stat-card label="Tickers" [value]="(r.n_tickers | number) ?? ''" />
    <app-stat-card
      label="Trading days"
      [value]="(r.n_trading_days | number) ?? ''"
    />
    <app-stat-card label="Base currency" [value]="r.base_currency" />
    <app-stat-card
      label="Price range"
      [value]="(r.price_start | formatDate: 'iso') + ' → ' + (r.price_end | formatDate: 'iso')"
    />
  </div>
  <p
    data-testid="assembly-hash"
    class="mt-2 text-data-xs text-text-tertiary font-mono"
  >
    assembly_hash: {{ r.assembly_hash }}
  </p>
}

@if (lastError(); as err) {
  <div
    data-testid="error-block"
    role="alert"
    class="mt-3 px-4 py-2 rounded-md border border-loss/40 bg-loss/10 text-data-sm text-loss"
  >
    {{ err }}
  </div>
}
