[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portopt-fund"
version = "0.1.0"
description = "deepagents investment-fund bridge: LLM chooses, optimizer computes"
# 3.12 floor: inherited workspace pin (numpy/pandas via portopt-core). Matches
# the other three members; uv resolves across the whole range.
requires-python = ">=3.12"

# The bridge layer. `fund` is the ONLY workspace member allowed to import both
# `optimizer` (portopt-core) and `portopt_db` — guarded the other way by the
# ingestion/db hygiene tests. deepagents/langgraph live here and NOWHERE else.
dependencies = [
    # Workspace bridge deps (resolved from local paths, see [tool.uv.sources]).
    "portopt-core",
    "portopt-db",
    # Agent runtime. deepagents is pre-1.0 and moves fast — pinned exactly to the
    # version whose API was verified by the Phase 0 exit probes (StoreBackend
    # instance, ModelFallbackMiddleware, skills preload). See SPEC.md D2/D4.
    "deepagents==0.7.14",
    "langgraph",
    # Durable checkpointer + store on a dedicated `langgraph` Postgres schema (D3).
    # psycopg + pool are the connection layer PostgresSaver/PostgresStore drive.
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "psycopg-pool",
    # Model path (D4): DeepSeek on Ollama Cloud via ChatOllama.
    "langchain-ollama",
    # D6 daemon: cron + drift-monitor scheduler (same lib the ingestion daemon uses).
    "APScheduler",
    # Config / env / CLI / TUI.
    "python-dotenv",
    "pydantic",
    "typer",
    "textual",
]

[project.optional-dependencies]
# Test-only deps, versions matched to the rest of the workspace so the single
# shared venv resolves one pytest/pytest-cov. pytest-asyncio kept for the async
# agent/worker paths that arrive in later phases.
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

# Optional per-provider LLM backends (SPEC D4, "Switchable LLM Backends"). Each is
# a plain extra; `langchain-ollama` stays a hard dep above (the default provider).
# Install one with `uv sync --package portopt-fund --extra <provider>`. `openai`
# also backs the `openrouter` provider (ChatOpenAI at OpenRouter's base_url) and,
# later, `microsoft`/Azure OpenAI — no separate package.
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
groq = ["langchain-groq"]
google = ["langchain-google-genai"]
# `aws` pulls boto3 (heavy). Bedrock is region-scoped: creds come from AWS_*/IAM,
# not a single key. TLS to Bedrock honours the boto3 `AWS_CA_BUNDLE` env var.
aws = ["langchain-aws"]
# `nvidia` = NVIDIA NIM. Hosted (build.nvidia.com) needs NVIDIA_API_KEY; a
# self-hosted NIM sets NVIDIA_BASE_URL and needs no key.
nvidia = ["langchain-nvidia-ai-endpoints"]
# `huggingface` is CLOUD-ONLY here (HuggingFaceEndpoint over the Inference API,
# HUGGINGFACEHUB_API_TOKEN). Deliberately NO torch/transformers — local inference
# (FUND_HF_MODE=local) is deferred and raises a clear RuntimeError in the builder.
huggingface = ["langchain-huggingface", "huggingface-hub"]
# Aggregate: install EVERY optional provider backend at once. Self-referential
# (`portopt-fund[...]`) so each provider's package list stays defined in exactly
# one place (its own extra above) — no duplication to drift. This is what CI's
# `uv sync --all-extras` resolves; the guard in test_all_llm_extra.py fails the
# build if a new provider extra is added without being wired in here.
all-llm = [
    "portopt-fund[openai,anthropic,groq,google,aws,nvidia,huggingface]",
]

# Human CLI, watch TUI, and the D6 daemon. Entrypoints reference modules filled
# in later phases (cli/tui/worker are empty stubs today); `uv sync` does not
# import them, so the scaffold syncs green before those modules exist.
[project.scripts]
fund = "fund.cli:app"
fund-tui = "fund.tui.app:main"
fund-worker = "fund.worker:main"

# Resolve the two bridge deps from the workspace (local paths), not PyPI.
[tool.uv.sources]
portopt-core = { workspace = true }
portopt-db = { workspace = true }

# fund-scoped pytest config: register the `integration` marker so the D3
# Postgres round-trip test (skipped without DATABASE_URL) doesn't warn.
[tool.pytest.ini_options]
markers = [
    "integration: needs a live Postgres DATABASE_URL (skipped otherwise)",
]

# src-layout: import package `fund` lives under fund/src/fund. Distinct import
# name from ingestion's `app` so the two never collide in the shared venv.
[tool.setuptools.packages.find]
where = ["src"]
include = ["fund*"]

[tool.setuptools.package-data]
fund = ["py.typed"]

# Coverage measured with `--cov=fund`. Branch on; the CI `fund-test` job gates
# line ≥ 0.80 (--cov-fail-under=80) plus the independent branch-rate 0.80 check.
[tool.coverage.run]
branch = true
source = ["fund"]
# Omit the skills/ tree: SKILL.md/reference.md are markdown, and the *.py support
# files (e.g. optimization-objective-map/factories.py) live in hyphenated dirs so
# they are NOT importable modules — they are text resources the agent reads via
# read_file. Measuring them would report an un-coverable file at 0% and sink the
# gate. Note `*/skills/*` matches the skills DIRECTORY only; the importable
# registry `fund/agents/skills.py` (a file, not a `skills/` dir) stays measured.
omit = ["*/skills/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
