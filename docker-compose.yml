services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: optimizer_db
    environment:
      POSTGRES_DB: optimizer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optimizer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optimizer_network

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: optimizer_adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "18081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - optimizer_network

  # Ingestion daemon — APScheduler in-process, no HTTP API.
  # Manual runs: docker compose exec scheduler python -m app.cli <command>
  scheduler:
    image: optimizer-scheduler:latest
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: optimizer_scheduler
    command: ["python", "-m", "app.worker"]
    # Sized above SCHEDULER_SHUTDOWN_DRAIN_TIMEOUT_SECONDS (default 30s) so the
    # daemon's in-process drain + forced-exit completes before Docker SIGKILLs
    # it (compose default is only 10s). Raise both together to drain long
    # fetches cleanly. See app/worker.py::_drain_and_shutdown (§5.5).
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/optimizer_db
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
    # Secrets are mounted read-only at /run/secrets/<name>; app.config reads them
    # (see PORTOPT_SECRETS_DIR). `portopt start` renders ./secrets/<name> from the
    # encrypted store before `docker compose up`; the files are git-ignored.
    secrets:
      - trading_212_api_key
      - trading_212_secret_key
      - fred_api_key
    ports:
      # Prometheus metrics only — no API is served
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/metrics').read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - optimizer_network

  # Fund bridge — deepagents/langgraph decision engine + drift-monitor daemon.
  # The one member that imports both `optimizer` and `portopt_db`; deepagents/
  # langgraph live only here. Long-lived command is the `fund-worker` daemon
  # (mirrors how `scheduler` runs `app.worker`): the container stays up and the
  # `optimizer` launcher execs a decision round + the cockpit into it.
  #   docker compose exec -d fund fund run <PID> --asof <ISO date>   # driver
  #   docker compose exec    fund fund-tui <PID>                      # cockpit
  # No HTTP API, no metrics port (out of scope for the fund daemon).
  fund:
    image: optimizer-fund:latest
    build:
      context: .
      dockerfile: fund/Dockerfile
    container_name: optimizer_fund
    command: ["python", "-m", "fund.worker"]
    # Sized above fund_shutdown_drain_timeout_seconds (default 30s) so the daemon
    # drains the in-flight step before Docker SIGKILLs it (compose default 10s).
    stop_grace_period: 45s
    env_file:
      - .env
      # Non-secret LLM selection (LLM_PROVIDER, FUND_PRIMARY_MODEL, per-provider
      # *_BASE_URL, AWS_REGION, AZURE_*) rendered by `portopt start` from
      # ~/.portopt/config.toml. Listed LAST so it overrides .env, and delivered via
      # env_file — never `environment:` — on purpose: `environment:` outranks
      # env_file AND `${...}` interpolation never reads .env.fund, so any of these
      # vars left under `environment:` would pin the container to the compose
      # default and silently discard the wizard's choice. Only wizard-set keys are
      # written, so an unset var is absent (never "") and falls through to
      # fund.config's own default (env-free run still = DeepSeek on Ollama Cloud).
      # `required: false` (Compose >= 2.24) lets a pre-setup `docker compose up`
      # still parse; `portopt start` always renders the file before `up` anyway.
      - path: .env.fund
        required: false
    environment:
      # Container-internal DB coordinates (override the localhost:54320 from .env).
      DATABASE_URL: postgresql://postgres:postgres@db:5432/optimizer_db
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      # Provider auth flows ONLY via file-based docker secrets: each <NAME>_FILE
      # points at /run/secrets/<name>, which fund.config._read_secret reads
      # (non-empty file wins; empty placeholder falls through to inline). No bare
      # secret key here — a plaintext value must never live in compose. aws is
      # absent (IAM/region, not a secret file).
      OLLAMA_API_KEY_FILE: /run/secrets/ollama_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      NVIDIA_API_KEY_FILE: /run/secrets/nvidia_api_key
      HUGGINGFACEHUB_API_TOKEN_FILE: /run/secrets/huggingfacehub_api_token
      AZURE_OPENAI_API_KEY_FILE: /run/secrets/azure_openai_api_key
      FRED_API_KEY_FILE: /run/secrets/fred_api_key
    # Mounted read-only at /run/secrets/<name>; `portopt start` renders
    # ./secrets/<name> from the encrypted store before `docker compose up`.
    secrets:
      - ollama_api_key
      - openrouter_api_key
      - openai_api_key
      - anthropic_api_key
      - google_api_key
      - groq_api_key
      - nvidia_api_key
      - huggingfacehub_api_token
      - azure_openai_api_key
      - fred_api_key
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Reach a host-side Ollama (or any self-hosted endpoint) via
    # host.docker.internal when OLLAMA_BASE_URL / a provider *_BASE_URL points there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - optimizer_network

volumes:
  postgres_data:

networks:
  optimizer_network:

# File-based secrets rendered by `portopt start` from ~/.portopt/secrets.enc into
# ./secrets/<name> (git-ignored). Docker mounts each at /run/secrets/<name>. Keys
# must match compose_secrets.SECRET_NAMES (parity-tested), so `render()` always
# writes every file (empty when unset) and `up` never fails on a missing `file:`.
secrets:
  # ingestion daemon secrets
  trading_212_api_key:
    file: ./secrets/trading_212_api_key
  trading_212_secret_key:
    file: ./secrets/trading_212_secret_key
  fred_api_key:
    file: ./secrets/fred_api_key
  # fund LLM-provider auth keys (switchable-LLM backends, SPEC D4)
  ollama_api_key:
    file: ./secrets/ollama_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  google_api_key:
    file: ./secrets/google_api_key
  groq_api_key:
    file: ./secrets/groq_api_key
  nvidia_api_key:
    file: ./secrets/nvidia_api_key
  huggingfacehub_api_token:
    file: ./secrets/huggingfacehub_api_token
  azure_openai_api_key:
    file: ./secrets/azure_openai_api_key
