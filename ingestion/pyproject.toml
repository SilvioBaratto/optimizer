[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "optimizer-ingestion"
version = "0.1.0"
description = "Optimizer Platform ingestion daemon and CLI"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.28.1",
]

# Test-only dependencies. pytest-cov is declared here (NOT in runtime
# dependencies) so the coverage tooling is explicit in pyproject.toml as well
# as ingestion/requirements.txt. Pins mirror the Testing block of ingestion/requirements.txt.
[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# Suppress warnings for untyped third-party libraries (requests, dateutil, etc.)
# that are installed but lack py.typed marker or stub packages.
disallow_untyped_calls = false

# SQLAlchemy models and third-party integrations (requests, reportlab,
# dateutil, APScheduler) use patterns incompatible with full strict mode. The
# settings below enable the checks that add real value while disabling those
# that produce only noise against legitimate patterns in this codebase.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_any_generics = false
warn_return_any = false
no_implicit_reexport = false

# SQLAlchemy Column/relationship descriptors return Any at runtime; suppress
# the subclassing errors that arise from inheriting untyped bases.
[[tool.mypy.overrides]]
module = ["app.models.*"]
disallow_subclassing_any = false

# Generic base repository uses dynamic SQLAlchemy attributes (__table__, id,
# created_at) that are only available at runtime via the ORM descriptor
# protocol — mypy cannot statically verify these on type[ModelType].
[[tool.mypy.overrides]]
module = ["app.repositories.*"]
disallow_subclassing_any = false
warn_return_any = false

# Scrapers, trading212 client, and yfinance sub-clients use heavy third-party
# libs (requests, bs4, selenium) that have no stubs; widen the checker there.
[[tool.mypy.overrides]]
module = [
    "app.services.scrapers.*",
    "app.services.trading212.*",
    "app.services.yfinance.*",
]
disallow_subclassing_any = false
warn_return_any = false
ignore_missing_imports = true

# Files that import untyped third-party libraries (requests, dateutil).
# mypy 1.4+ differentiates import-missing vs import-untyped; suppress both.
[[tool.mypy.overrides]]
module = [
    "app.repositories.yfinance_repository",
    "app.services.scrapers.fred_scraper",
    "app.services.scrapers.ilsole_scraper",
    "app.services.scrapers.tradingeconomics_scraper",
    "app.services.trading212.client",
    "app.services.yfinance.news.aggregator",
    "app.services.yfinance.news.scraper",
]
ignore_missing_imports = true

# Third-party libraries that are installed but lack stubs or py.typed markers.
# Setting ignore_missing_imports here suppresses both import-missing and
# import-untyped errors for these packages.
[[tool.mypy.overrides]]
module = [
    "requests",
    "requests.*",
    "dateutil",
    "dateutil.*",
    "bs4",
    "bs4.*",
    "reportlab",
    "reportlab.*",
    "apscheduler",
    "apscheduler.*",
    "baml_client",
    "baml_client.*",
    "sqlalchemy_utils",
    "sqlalchemy_utils.*",
]
ignore_missing_imports = true
ignore_errors = true

# Coverage measured with `cd ingestion` as cwd via `--cov=app`. source=["app"] keeps
# alembic/ (ingestion/alembic/, outside app/) out of scope; the omit list is explicit
# so the intent survives any future cwd/source change. No --cov-fail-under here
# — the floor lands in the final CI-gate issue, keeping local runs flag-free.
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    '*/__init__.py',
    '*/alembic/*',
    # Protocol declarations: every member is a `...` stub with no runtime body.
    # coverage still emits a branch arc per stub, so these files report ~50%
    # branch coverage no matter what — an unreachable floor that drags the
    # real number down. There is nothing here to execute.
    '*/protocols/interfaces.py',
    'app/services/universe/trading212/protocols.py',
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    'pragma: no cover',
    'if TYPE_CHECKING:',
    '@(abc\.)?abstractmethod',
    'raise NotImplementedError',
    '^\s*\.\.\.$',
]
