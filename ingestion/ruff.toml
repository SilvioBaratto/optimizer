extend = "../pyproject.toml"
extend-exclude = ["baml_client"]

[lint]
# Ignore rules that are intentional SQLAlchemy/test patterns, or that
# conflict with the project's established conventions.
extend-ignore = [
    # B008 (function-call-in-default-argument) is retained pending review: the
    # daemon is headless and has no route-handler dependency injection left to
    # justify it, but removing the rule can surface unrelated call-in-default
    # lint failures elsewhere that are out of scope for this change.
    "B008",
    # SQLAlchemy ORM models use mutable class-level defaults
    # (e.g. relationship(), Column()) which are handled by SA's descriptor protocol.
    "RUF012",
    # Line-length: ingestion code has longer docstrings and error messages;
    # 88 is already the configured maximum but legacy lines exceed it.
    "E501",
    # Unicode characters in strings: ingestion code uses mathematical notation
    # and locale-specific content in scraped data and docstrings.
    "RUF001",
    # E402 (module-level-import-not-at-top-of-file) is retained pending
    # review: the daemon has no app-factory-style conditional imports left to
    # justify it, but removing the rule can surface unrelated import-order
    # failures elsewhere that are out of scope for this change.
    "E402",
    # Suspicious bind-all-interfaces: 0.0.0.0 binding is correct for Docker.
    "S104",
    # Non-cryptographic random: used for job ID generation, not security.
    "S311",
    # Uppercase variable names: SQLAlchemy/sklearn convention (P, Q, X, y, etc.)
    "N806",
    "N803",
    # Single-letter lower-cased import: sqlalchemy-specific aliases (e.g. `orm`)
    "N812",
    # Exception names: some internal names predate the suffix convention
    "N818",
    # Invalid function name: SQLAlchemy event listeners use snake-case conventions
    "N802",
]

[lint.per-file-ignores]
# Test files: assert statements are standard pytest idiom
"tests/**" = [
    "S101",   # assert
    "S106",   # hardcoded-password-func-arg (test fixtures use dummy passwords)
    "S608",   # hardcoded-sql-expression (raw SQL in tests is intentional)
    "B017",   # assert-raises-exception (pytest.raises without match= is common)
    "RUF043", # pytest-raises-ambiguous-pattern
    "RUF059", # unused-unpacked-variable (common in test helpers)
    "RUF022", # unsorted-dunder-all
    "SIM117", # multiple-with-statements (test clarity over brevity)
    "S110",   # try-except-pass (intentional in test helpers)
    "S112",   # try-except-continue
]
# App models and services: SQLAlchemy/ORM-specific patterns
"app/models/**" = ["RUF012", "N806"]
"app/repositories/**" = ["S608"]
# __all__ with intentional categorical grouping — categories are documentation
"app/services/yfinance/__init__.py" = ["RUF022"]
"app/services/__init__.py" = ["RUF022"]
# Alembic migrations use table names from constants/introspection, not user input
"alembic/**" = ["S608"]
