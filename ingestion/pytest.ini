[pytest]
# Pytest configuration for the headless ingestion daemon

# Test paths
testpaths = tests

# Python file patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for async tests
asyncio_mode = auto

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external APIs)
    e2e: End-to-end tests (full workflows)
    slow: Slow running tests
    criterion(id): bind this test to acceptance-criterion <id>

# Coverage configuration (when using pytest-cov)
# --ignore excludes tests/integration/deployment from the default `pytest tests/`
# run (issue #12): those fixtures build a venv, `docker compose build/up`, and start
# every service in docker-compose.yml, including Postgres/Adminer on a developer's own
# ports, and their `finally` tears the stack down. --ignore only applies when the path
# is not explicitly requested, so `pytest tests/integration/deployment` still opts in.
addopts =
    -v
    --tb=short
    --strict-markers
    --ignore=tests/integration/deployment

# Minimum version requirement
minversion = 8.0

# Display options
console_output_style = progress
