[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portopt"
version = "0.1.0"
description = "Portfolio optimization library built on skfolio and scikit-learn"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.10"
authors = [
    {name = "Silvio Baratto"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "skfolio>=0.20.1",
    "jinja2>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/SilvioBaratto/optimizer"
Documentation = "https://silviobaratto.github.io/optimizer"
Repository = "https://github.com/SilvioBaratto/optimizer"
Issues = "https://github.com/SilvioBaratto/optimizer/issues"
Changelog = "https://github.com/SilvioBaratto/optimizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "hypothesis>=6.151.9", "pyyaml>=6.0.3"]
lint = ["ruff>=0.15.6", "pip-audit>=2.10.0"]
typecheck = ["mypy>=1.19.1", "pyright[nodejs]==1.1.408"]
docs = [
    "mkdocs-material>=9.7.2",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
]
dev = ["portopt[test,lint,typecheck,docs]", "pre-commit>=4.5.1"]

[tool.setuptools.packages.find]
include = ["optimizer*", "research*"]

[tool.setuptools.package-data]
optimizer = ["py.typed"]
research = ["py.typed", "templates/*.j2"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["theory/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S", "RUF", "C4", "PTH"]
ignore = ["RUF002", "RUF003"]  # allow unicode in docstrings/comments (mathematical notation)

[tool.ruff.lint.per-file-ignores]
"optimizer/__init__.py" = ["E402"]  # logging NullHandler must precede module imports
"optimizer/**" = ["N803", "N806"]  # sklearn convention: X, y parameter names
"tests/**" = ["N803", "N806", "S101"]
# Scheduler tests intentionally shell out to `sh -n` / `sh -c` for script
# validation; the subprocess S-rules and raw-shell-snippet E501 would add
# nothing here.
"tests/scheduler/**" = ["N803", "N806", "S101", "S603", "S607", "E501"]
# Boundary-gate tests intentionally invoke subprocess to verify import isolation
# in a fresh interpreter; args are fixed literals (sys.executable + hardcoded -c).
"tests/research/test_cycle2_boundary_gate.py" = ["N803", "N806", "S101", "S603", "S607", "E501"]
"tests/research/test_reporting_boundaries.py" = ["N803", "N806", "S101", "S603", "S607", "E501"]
"tests/research/test_reporting_init.py" = ["N803", "N806", "S101", "S603", "S607", "E501"]
# CLI import isolation test spawns a fresh interpreter with fixed args (sys.executable + hardcoded -c).
"tests/research/test_cli_imports.py" = ["N803", "N806", "S101", "S603", "S607"]
# Pipeline regime import isolation test spawns a fresh interpreter with fixed literal args.
"tests/research/test_pipeline_regime.py" = ["N803", "N806", "S101", "S603", "S607", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# sklearn/skfolio lack type stubs — suppress errors from untyped bases
[[tool.mypy.overrides]]
module = ["optimizer.preprocessing.*", "optimizer.fx.*"]
disallow_subclassing_any = false

# skfolio BaseMu / BaseCovariance lack type stubs — suppress subclassing errors
[[tool.mypy.overrides]]
module = [
    "optimizer.optimization._regime_blended_mean_risk",
    "optimizer.views._factory",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
    "optimizer.scoring._factory",
    "optimizer.validation._factory",
    "optimizer.rebalancing._rebalancer",
]
warn_return_any = false

# Parity-cycle factory wrappers — silence subclass-of-Any if/when
# downstream code subclasses skfolio bases through these modules.
[[tool.mypy.overrides]]
module = [
    "optimizer.cluster._factory",
    "optimizer.distance._factory",
    "optimizer.linear_model._factory",
    "optimizer.uncertainty_set._factory",
]
disallow_subclassing_any = false

[tool.ruff.lint.isort]
known-first-party = ["optimizer", "research"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["optimizer"]
omit = []

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["optimizer", "examples"]
exclude = [
    "**/__pycache__",
]

# Libraries with missing/incomplete stubs (sklearn, skfolio)
reportMissingTypeStubs = false
reportMissingImports = false

# Unknown type propagation from pandas/numpy/sklearn/skfolio
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

# Pandas/numpy operator and attribute false positives
reportOperatorIssue = false
reportAttributeAccessIssue = false
reportIndexIssue = false

# Demote to warning (catch real bugs, don't block on stub gaps)
reportReturnType = "warning"
reportCallIssue = "warning"
reportArgumentType = "warning"

# sklearn/skfolio base class overrides have incompatible signatures
reportIncompatibleMethodOverride = false

# pandas operations return overly broad union types (Scalar | Series | DataFrame)
reportAssignmentType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
