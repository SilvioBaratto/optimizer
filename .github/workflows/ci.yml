name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[lint]"
      - run: ruff check optimizer/ tests/
      - run: ruff format --check optimizer/ tests/
      - run: pip-audit --strict --desc on

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[typecheck]"
      - run: mypy optimizer/

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[typecheck]"
      - uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef  # v3.0.2
        with:
          version: '1.1.398'
          python-version: '3.10'
          level: error
          annotate: all

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[test]"
      - run: pytest tests/ -v --tb=short --cov=optimizer --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      # Branch-aware, per-metric floor: fails if line-rate OR branch-rate < 0.80.
      # Complements the blended --cov-fail-under so a branch regression cannot
      # hide behind high statement coverage. 3.12 leg only (coverage.xml is
      # identical across legs; one check is sufficient).
      - if: matrix.python-version == '3.12'
        run: python scripts/check_branch_coverage.py coverage.xml 0.80
      - if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      # api/app imports the root optimizer library (`from optimizer...`), so the
      # editable root install must precede the api requirements.
      - run: pip install -e .
      - run: pip install -r api/requirements.txt
      # --cov-report=xml:coverage.xml writes api/coverage.xml (the `cd api`
      # scope only covers this step). --cov-fail-under=80 is the fast blended
      # first gate; the floor lives in CI, not pyproject, so local pytest stays
      # flag-free.
      - run: cd api && pytest tests/ -v --tb=short --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80
      # Branch-aware, per-metric floor: fails if line-rate OR branch-rate < 0.80,
      # so a branch regression cannot hide behind high statement coverage.
      # Mirrors the optimizer `test` job. Reads api/coverage.xml from repo root.
      - run: python scripts/check_branch_coverage.py api/coverage.xml 0.80

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # ChromeHeadlessNoSandbox is a built-in @angular/build:karma launcher
      # (base ChromeHeadless + --no-sandbox/--disable-gpu/--disable-dev-shm-usage),
      # required because the GitHub Actions sandbox blocks Chrome's own sandbox.
      # pipefail (GitHub bash default) propagates a test failure through `tee`;
      # the captured istanbul summary then feeds the coverage floor gate.
      - run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage | tee coverage-output.txt
      - run: node scripts/check-coverage.mjs coverage-output.txt
