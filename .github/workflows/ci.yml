name: CI

on:
  push:
    # The prefixed branches run CI on push so a change merged without a pull
    # request still carries the statuses branch protection requires.
    branches: [main, development, "feature/**", "bugfix/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [main, development]
  # release.yml runs this whole workflow as the gate in front of the PyPI upload.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# uv workspace (portopt-core + ingestion + packages/portopt-db). `uv sync
# --all-packages --all-extras` builds one shared venv for the whole workspace.
# NOTE (workspace tradeoff): a single venv means the old "install only ingestion
# so `optimizer` is absent" isolation is gone — enforcement of the
# ingestion-must-not-import-optimizer boundary now rests entirely on the static
# source-scan guard (tests/unit/hygiene/test_no_optimizer_import.py) + the
# portopt-core⊬portopt_db guard.
#
# Tool versions are pinned so a new uv release or runner-image Python cannot
# change CI without a commit: setup-uv's `version` mirrors the uv pinned in both
# Dockerfiles (tests/test_ci_workflow_config.py keeps them equal), and every job
# names its Python.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      # Each member keeps its own ruff.toml, which ruff resolves per file, so one
      # invocation from the root lints every tree with that tree's settings.
      - run: uv run ruff check packages/portopt-core/optimizer/ tests/ ingestion/ fund/ packages/portopt-db/
      - run: uv run ruff format --check packages/portopt-core/optimizer/ tests/ ingestion/ fund/ packages/portopt-db/
      # The entrypoints run inside the images and the installers on user machines.
      - run: shellcheck $(git ls-files '*.sh') scripts/optimizer
      # pip-audit the resolved third-party set. The three editable workspace
      # members (portopt-core/-db/-fund) aren't on PyPI, so auditing the live env
      # trips --strict on "not found on PyPI". Export the locked deps WITHOUT the
      # workspace members (--no-emit-workspace) and audit that file instead, so
      # --strict stays meaningful for real CVEs without failing on the local pkgs.
      - run: uv export --frozen --no-emit-workspace --all-packages --all-extras --format requirements-txt -o requirements-audit.txt
      - run: uv run pip-audit --strict --desc on -r requirements-audit.txt

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run mypy packages/portopt-core/optimizer/
      # portopt-db ships py.typed; hold it to its own strict [tool.mypy] gate.
      - run: cd packages/portopt-db && uv run mypy src/portopt_db
      # ingestion carries its own [tool.mypy] (relaxed for SQLAlchemy and the
      # untyped scraper libraries); hold it to that config too.
      - run: cd ingestion && uv run mypy app

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run pyright --warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short --cov=optimizer --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Forks have no secrets and PR uploads are best-effort, but a push to
          # main that fails to upload must be visible.
          fail_ci_if_error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  ingestion-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: cd ingestion && uv run pytest tests/ -v --tb=short --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80

  portopt-db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: cd packages/portopt-db && uv run pytest -v --tb=short --cov=portopt_db --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=90

  fund-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras --python ${{ matrix.python-version }}
      - run: cd fund && uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short --cov=fund --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80

  # The unit suites run on in-memory SQLite with hand-built prerequisite tables,
  # so only this job proves the whole Alembic chain applies to an empty
  # PostgreSQL and that the live-Postgres `integration` tests pass. Those tests
  # refuse DATABASE_URL (a developer's live database) and run only against
  # FUND_TEST_DATABASE_URL, so the job creates a separate scratch database.
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: optimizer_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimizer_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimizer_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: cd packages/portopt-db && uv run alembic upgrade head
      # A model that changed without a migration, and a recent migration that can
      # no longer be reversed, both pass `upgrade head` and surface only in production.
      - run: cd packages/portopt-db && uv run alembic check
      - run: cd packages/portopt-db && uv run alembic downgrade 70393a606218 && uv run alembic upgrade head
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d optimizer_db -c "CREATE DATABASE portopt_test"
      - run: cd packages/portopt-db && uv run pytest tests/integration -m integration -v --tb=short
        env:
          PORTOPT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portopt_test
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d optimizer_db -c "CREATE DATABASE fund_test"
      - run: cd fund && uv run pytest tests/integration -m integration -v --tb=short
        env:
          FUND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fund_test

  # Parses the compose file and builds both shipped images, so a broken
  # Dockerfile or compose edit fails here instead of on a user's `portopt start`.
  # install.ps1 is the Windows front door and no other job executes it. The check script
  # runs it against stub git, uv and portopt under Windows PowerShell 5.1 (`shell:
  # powershell`) and under PowerShell 7 (`shell: pwsh`).
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/ci/check-install-ps1.ps1
      - name: install.ps1 under PowerShell 7
        shell: pwsh
        run: ./scripts/ci/check-install-ps1.ps1

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Secret files are git-ignored and rendered by `portopt start`; empty
      # placeholders let the compose file resolve the same way it does there. The
      # fund worker refuses to start without a provider key, so that one secret holds
      # a placeholder: building a chat client needs a key but makes no request.
      - run: |
          mkdir -p secrets
          grep -oE '\./secrets/[a-z0-9_]+' docker-compose.yml | xargs touch
          echo placeholder-not-a-real-key > secrets/ollama_api_key
      - run: docker compose --profile ingestion --profile fund config --quiet
      - run: docker compose --profile ingestion --profile fund build
      # Boots both stacks the way `portopt start` does. The unit suites cannot see an
      # entrypoint that dies, a migration that fails on an empty database or a worker
      # that never answers its healthcheck; `up --wait` fails the job on any of them.
      - run: docker compose --profile ingestion --profile fund up -d --wait --wait-timeout 300
      - name: Container logs
        if: failure()
        run: docker compose --profile ingestion --profile fund logs --no-color
      # Both workers drain and exit 0 on SIGTERM; 137 means the stop was ignored
      # until Docker's SIGKILL.
      - name: A stop exits cleanly
        run: |
          docker compose --profile ingestion --profile fund stop scheduler fund
          for name in optimizer_scheduler optimizer_fund; do
            code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
            if [ "$code" != "0" ]; then
              echo "$name exited with $code on stop (expected 0)" >&2
              exit 1
            fi
          done
      - name: Tear down
        if: always()
        run: docker compose --profile ingestion --profile fund down --volumes
