name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# uv workspace (portopt-core + ingestion + packages/portopt-db). `uv sync
# --all-packages --all-extras` builds one shared venv for the whole workspace.
# NOTE (workspace tradeoff): a single venv means the old "install only ingestion
# so `optimizer` is absent" isolation is gone — enforcement of the
# ingestion-must-not-import-optimizer boundary now rests entirely on the static
# source-scan guard (tests/unit/hygiene/test_no_optimizer_import.py) + the
# portopt-core⊬portopt_db guard. See tasks/plan.md risk #1.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check optimizer/ tests/
      - run: uv run ruff format --check optimizer/ tests/
      - run: uv run pip-audit --strict --desc on

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run mypy optimizer/
      # portopt-db ships py.typed; hold it to its own strict [tool.mypy] gate.
      - run: cd packages/portopt-db && uv run mypy src/portopt_db

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short --cov=optimizer --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      # Branch-aware per-metric floor (fails if line OR branch < 0.80). 3.12 leg only.
      - if: matrix.python-version == '3.12'
        run: uv run python scripts/check_branch_coverage.py coverage.xml 0.80
      - if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  ingestion-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: cd ingestion && uv run pytest tests/ -v --tb=short --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80
      - run: uv run python scripts/check_branch_coverage.py ingestion/coverage.xml 0.80

  portopt-db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: cd packages/portopt-db && uv run pytest -v --tb=short --cov=portopt_db --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=90
      - run: uv run python scripts/check_branch_coverage.py packages/portopt-db/coverage.xml 0.80
