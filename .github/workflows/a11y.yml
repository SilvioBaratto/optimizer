name: A11y

# Accessibility audit for the Angular frontend (issue #442).
#
# What this audits
# ----------------
#   * axe-core (npm run a11y)  — WCAG 2.1 AA scan of every shipped page route
#     via @axe-core/cli; writes a markdown report to
#     frontend/docs/a11y-audit-results.md.
#   * Lighthouse CI            — performance / a11y / best-practices / SEO
#     scan of the five operationally important pages (Dashboard,
#     Portfolio Builder, Optimization Studio, Risk Center, Settings).
#
# Step exit semantics
# -------------------
# Both audit steps EXIT NON-ZERO when they detect critical/serious
# WCAG 2.1 AA violations — the failure is recorded in the run logs.
# `continue-on-error: true` on each audit step keeps the JOB green during
# the baseline-cleanup period, so PRs are not blocked while the team
# burns down existing violations. Once the baseline is clean, drop
# `continue-on-error` and wire this workflow into branch protection as a
# required status check (a repo-level setting, not a workflow setting).
#
# Known limitation
# ----------------
# This workflow does NOT spin up the FastAPI backend. Pages whose content
# is rendered from API responses (Dashboard, Risk Center, Macro
# Intelligence, etc.) are audited in their *skeleton* state — nav chrome,
# loading states, and static layout — not in their fully-loaded data
# form. Treat green as "no a11y regressions in static structure", not as
# full coverage.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: axe + Lighthouse a11y audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Serve built bundle with SPA fallback
        # `serve -s` rewrites unknown paths to /index.html so Angular's
        # client-side router resolves /portfolio-builder, /risk-center, etc.
        # Without `-s` those would 404 and the audit would only see the home
        # route. wait-on blocks until the server is actually accepting TCP.
        run: |
          npx --yes serve@14 -s dist/frontend/browser -l 4200 \
            > /tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          npx --yes wait-on@7 --timeout 60000 http://localhost:4200

      - name: Run axe-core WCAG 2.1 AA audit
        id: axe
        # Step exits non-zero on critical/serious violations (see scripts/a11y.mjs).
        # Job stays green during baseline period; promote later by removing this.
        continue-on-error: true
        env:
          A11Y_BASE_URL: http://localhost:4200
        run: npm run a11y

      - name: Run Lighthouse CI on five key pages
        id: lighthouse
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12.6.2
        with:
          urls: |
            http://localhost:4200/
            http://localhost:4200/portfolio-builder
            http://localhost:4200/optimization-studio
            http://localhost:4200/risk-center
            http://localhost:4200/settings
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Upload axe markdown report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: a11y-axe-report
          path: frontend/docs/a11y-audit-results.md
          if-no-files-found: warn

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/serve.log || true

      - name: Stop served bundle
        if: always()
        run: |
          if [ -f /tmp/serve.pid ]; then
            kill "$(cat /tmp/serve.pid)" 2>/dev/null || true
          fi
