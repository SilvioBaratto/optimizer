name: Smoke

# End-to-end smoke test on pull requests:
#   - Boots docker-compose (db + api)
#   - Runs alembic migrations + seeds api/tests/fixtures/smoke_prices.sql
#   - Exercises /health, /api/v1/optimize, /api/v1/backtest via scheduler/smoke.sh
#
# Once this workflow is green on main, enable it as a required status check in
# the branch-protection rules for main so PRs cannot merge without it.
# (The branch-protection wiring is deliberately kept out of this workflow file
# because it is a repo-level setting, not something a workflow can configure.)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: docker-compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create .env for docker-compose
        # docker-compose.yml has `env_file: - .env`, so the file must exist
        # before `docker compose up`. LLM keys flow from secrets; Trading 212 /
        # FRED are left blank because the smoke universe never touches them.
        run: |
          cat <<EOF > .env
          DATABASE_URL=postgresql://postgres:postgres@db:5432/optimizer_db
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          TRADING_212_API_KEY=
          FRED_API_KEY=
          EOF

      - name: Boot db + api via docker compose
        run: docker compose up -d db api

      - name: Wait for api health (host port 8005)
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8005/health > /dev/null; then
              echo "api healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "api never became healthy"
          docker compose logs api
          exit 1

      - name: Apply Alembic migrations (belt-and-suspenders)
        # The api container's entrypoint already runs `alembic upgrade head` on
        # start, so by the time the health check passes migrations are applied.
        # This extra call asserts migrations are at head before the smoke run.
        run: docker compose exec -T api alembic upgrade head

      - name: Seed deterministic price fixture
        run: |
          docker compose exec -T db \
            psql -U postgres -d optimizer_db \
            < api/tests/fixtures/smoke_prices.sql

      - name: Run smoke script
        env:
          SMOKE_API_URL: http://localhost:8005
        run: ./scheduler/smoke.sh

      - name: Dump api logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down docker-compose stack
        if: always()
        run: docker compose down -v --remove-orphans
